
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | FamilyCoins</title>
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/register.js" defer></script>
</head>
<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-logo">🌱</div>

            <h1>Únete a FamilyCoins</h1>
            <p>Crea tu cuenta y empieza a cuidar vuestro jardín.</p>

            <form id="register-form">

                <label for="nombre">Nombre</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Tu nombre"
                    maxlength="100"
                    required
                >

                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ejemplo@email.com"
                    maxlength="150"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mínimo 4 caracteres y una mayúscula"
                    required
                >

                <label for="confirm-password">Repite tu contraseña</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Repite tu contraseña"
                    required
                >

                <p id="register-message" role="alert"></p>

                <button type="submit" id="register-button">
                    Crear mi cuenta
                </button>

            </form>

            <p class="auth-footer">
                ¿Ya tienes cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>

        </section>

    </main>

</body>
</html>
